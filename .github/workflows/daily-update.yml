name: Daily Readme GIF Refresh

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-gif:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GIF using Docker Compose
        run: docker compose run --rm gif

      - name: Commit and push updated GIF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output.gif
          if git diff --staged --quiet; then
            echo "No changes detected in output.gif."
          else
            TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
            git commit -m "chore(gif): daily refresh ${TIMESTAMP} [skip ci]"
            git push
          fi