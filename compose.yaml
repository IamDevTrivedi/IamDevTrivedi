services:
  gif:
    build:
      dockerfile_inline: |
        FROM python:3.12-slim
        RUN apt-get update && apt-get install -y --no-install-recommends ffmpeg
        RUN pip install --no-cache-dir github-readme-terminal
    user: "1000:1000"
    working_dir: /work
    environment:
      HOME: /tmp
    volumes:
      - ./:/work:Z
    command: python make_gif.py
